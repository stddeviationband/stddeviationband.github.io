<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="images/favicon-16x16.png" type="image/x-icon" />

  <!-- Font Awesome v5 -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>

  <title>STANDARD DeVIATION – Gallery</title>

  <!-- Bootstrap + Google Font + Site CSS -->
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,500&display=swap"
        rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header partial -->
  <div data-include="partials/header.html"></div>

  <main class="container my-5">
    <h1 class="mb-4">Photo Gallery</h1>

    <!-- Category filter tabs (built automatically from the CATEGORIES list below) -->
    <div class="gallery-tabs" id="galleryTabs"></div>

    <div class="gallery-grid" id="galleryGrid">
      <!-- Images are rendered here by JS from the GALLERY_IMAGES array -->
    </div>
  </main>

  <!-- Lightbox Modal -->
  <div class="modal fade" id="lightboxModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl" role="document">
      <div class="modal-content bg-transparent border-0">
        <button type="button" class="close text-white ml-auto mr-2 mt-2" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>

        <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous photo">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button type="button" class="lightbox-nav lightbox-next" aria-label="Next photo">
          <i class="fas fa-chevron-right"></i>
        </button>

        <div class="modal-body p-0">
          <img id="lightboxImage" src="" alt="" class="img-fluid w-100" style="max-height:85vh; object-fit:contain;">
        </div>
        <div class="modal-footer justify-content-center bg-transparent border-0">
          <div id="lightboxCaption" class="text-white small"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer partial -->
  <div data-include="partials/footer.html"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/partials.js"></script>

  <script>
    /* ==========================================================================
       CATEGORIES
       Controls the filter tabs, in the order they appear.
       'key' must match the category used below in GALLERY_IMAGES.
       ========================================================================== */
    const CATEGORIES = [
      { key: 'taylorsville', label: 'Taylorsville Dayzz' },
      { key: 'botd',         label: 'Bluffdale Old Town Days' },
      { key: 'general',      label: 'Live & Promo' },
      { key: 'members',      label: 'Band Members' },
      { key: 'all',          label: 'All Photos' },
    ];

    /* ==========================================================================
       GALLERY_IMAGES
       One line per photo: { src, alt, category }
       category must be one of the CATEGORIES keys above (not 'all').

       TO ADD YOUR 40 TAYLORSVILLE DAYZZ PHOTOS:
       Scroll to the "TAYLORSVILLE DAYZZ" section near the bottom of this
       array and copy/paste one line per photo, updating the filename and
       alt text each time. Example line is already there for you.
       ========================================================================== */
    const GALLERY_IMAGES = [
      // ---- BLUFFDALE OLD TOWN DAYS 2025 ----
      { src: 'images/gallery/band_botd_2025.png', alt: 'Bluffdale Old Town Days 2025', category: 'botd' },
      { src: 'images/gallery/bd01_2025.JPEG',     alt: 'Band01 Bluffdale 2025',        category: 'botd' },
      { src: 'images/gallery/bd02_2025.JPEG',     alt: 'Band02 Bluffdale 2025',        category: 'botd' },
      { src: 'images/gallery/bd03_2025.JPEG',     alt: 'Band03 Bluffdale 2025',        category: 'botd' },
      { src: 'images/gallery/bd04_2025.JPEG',     alt: 'Band04 Bluffdale 2025',        category: 'botd' },
      { src: 'images/gallery/bd05_2025.JPEG',     alt: 'Band05 Bluffdale 2025',        category: 'botd' },
      { src: 'images/gallery/bd06_2025.JPEG',     alt: 'Band06 Bluffdale 2025',        category: 'botd' },
      { src: 'images/gallery/bd07_2025.JPEG',     alt: 'Band07 Bluffdale 2025',        category: 'botd' },
      { src: 'images/gallery/bd08_2025.jpeg',     alt: 'Band08 Bluffdale 2025',        category: 'botd' },

      // ---- LIVE & PROMO (general shots) ----
      { src: 'images/gallery/band_2025.jpg', alt: 'Promo 2025',      category: 'general' },
      { src: 'images/gallery/band100.jpg',   alt: 'Live performance', category: 'general' },
      { src: 'images/gallery/band102.jpg',   alt: 'On stage',         category: 'general' },
      { src: 'images/gallery/band103.jpg',   alt: 'Crowd shot',       category: 'general' },
      { src: 'images/gallery/band104.jpg',   alt: 'Backstage',        category: 'general' },
      { src: 'images/gallery/band105.jpg',   alt: 'Soundcheck',       category: 'general' },
      { src: 'images/gallery/band.jpg',      alt: 'Band shot',        category: 'general' },

      // ---- BAND MEMBERS ----
      { src: 'images/gallery/bryce.jpg', alt: 'Bryce Hayes',   category: 'members' },
      { src: 'images/gallery/wade.jpg',  alt: 'Wade Huntsman', category: 'members' },

      // ---- TAYLORSVILLE DAYZZ ----
      // Filenames follow your "tvd 2026 N.jpg" pattern (spaces URL-encoded as %20).
      // If any files use a different extension (.JPG, .jpeg, .png), fix that
      // specific line to match.
      { src: 'images/gallery/tvd_2026_1.jpg', alt: 'Taylorsville Dayzz 2026 - photo 1', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_2.jpg', alt: 'Taylorsville Dayzz 2026 - photo 2', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_3.jpg', alt: 'Taylorsville Dayzz 2026 - photo 3', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_4.jpg', alt: 'Taylorsville Dayzz 2026 - photo 4', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_5.jpg', alt: 'Taylorsville Dayzz 2026 - photo 5', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_6.jpg', alt: 'Taylorsville Dayzz 2026 - photo 6', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_7.jpg', alt: 'Taylorsville Dayzz 2026 - photo 7', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_8.jpg', alt: 'Taylorsville Dayzz 2026 - photo 8', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_9.jpg', alt: 'Taylorsville Dayzz 2026 - photo 9', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_10.jpg', alt: 'Taylorsville Dayzz 2026 - photo 10', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_11.jpg', alt: 'Taylorsville Dayzz 2026 - photo 11', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_12.jpg', alt: 'Taylorsville Dayzz 2026 - photo 12', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_13.jpg', alt: 'Taylorsville Dayzz 2026 - photo 13', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_14.jpg', alt: 'Taylorsville Dayzz 2026 - photo 14', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_15.jpg', alt: 'Taylorsville Dayzz 2026 - photo 15', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_16.jpg', alt: 'Taylorsville Dayzz 2026 - photo 16', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_17.jpg', alt: 'Taylorsville Dayzz 2026 - photo 17', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_18.jpg', alt: 'Taylorsville Dayzz 2026 - photo 18', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_19.jpg', alt: 'Taylorsville Dayzz 2026 - photo 19', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_20.jpg', alt: 'Taylorsville Dayzz 2026 - photo 20', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_21.jpg', alt: 'Taylorsville Dayzz 2026 - photo 21', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_22.jpg', alt: 'Taylorsville Dayzz 2026 - photo 22', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_23.jpg', alt: 'Taylorsville Dayzz 2026 - photo 23', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_24.jpg', alt: 'Taylorsville Dayzz 2026 - photo 24', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_25.jpg', alt: 'Taylorsville Dayzz 2026 - photo 25', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_26.jpg', alt: 'Taylorsville Dayzz 2026 - photo 26', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_27.jpg', alt: 'Taylorsville Dayzz 2026 - photo 27', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_28.jpg', alt: 'Taylorsville Dayzz 2026 - photo 28', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_29.jpg', alt: 'Taylorsville Dayzz 2026 - photo 29', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_30.jpg', alt: 'Taylorsville Dayzz 2026 - photo 30', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_31.jpg', alt: 'Taylorsville Dayzz 2026 - photo 31', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_32.jpg', alt: 'Taylorsville Dayzz 2026 - photo 32', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_33.jpg', alt: 'Taylorsville Dayzz 2026 - photo 33', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_34.jpg', alt: 'Taylorsville Dayzz 2026 - photo 34', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_35.jpg', alt: 'Taylorsville Dayzz 2026 - photo 35', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_36.jpg', alt: 'Taylorsville Dayzz 2026 - photo 36', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_37.jpg', alt: 'Taylorsville Dayzz 2026 - photo 37', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_38.jpg', alt: 'Taylorsville Dayzz 2026 - photo 38', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_39.jpg', alt: 'Taylorsville Dayzz 2026 - photo 39', category: 'taylorsville' },
      { src: 'images/gallery/tvd_2026_40.jpg', alt: 'Taylorsville Dayzz 2026 - photo 40', category: 'taylorsville' },
    ];

    /* ==========================================================================
       Rendering + filtering
       ========================================================================== */
    let activeCategory = 'taylorsville';
    let currentSet = GALLERY_IMAGES;   // the currently visible (filtered) list
    let currentIndex = 0;              // index within currentSet, for the lightbox

    const tabsEl = document.getElementById('galleryTabs');
    const gridEl = document.getElementById('galleryGrid');

    function renderTabs() {
      tabsEl.innerHTML = CATEGORIES.map(cat => `
        <button type="button"
                class="gallery-tab-btn${cat.key === activeCategory ? ' active' : ''}"
                data-category="${cat.key}">
          ${cat.label}
        </button>
      `).join('');
    }

    function renderGrid() {
      currentSet = activeCategory === 'all'
        ? GALLERY_IMAGES
        : GALLERY_IMAGES.filter(img => img.category === activeCategory);

      gridEl.innerHTML = currentSet.map((img, i) => `
        <a href="${img.src}" data-index="${i}">
          <img src="${img.src}" alt="${img.alt}" loading="lazy">
        </a>
      `).join('');
    }

    function setCategory(key) {
      activeCategory = key;
      renderTabs();
      renderGrid();
    }

    tabsEl.addEventListener('click', function (e) {
      const btn = e.target.closest('.gallery-tab-btn');
      if (!btn) return;
      setCategory(btn.dataset.category);
    });

    renderTabs();
    renderGrid();

    /* ==========================================================================
       Lightbox with prev / next
       ========================================================================== */
    const lightImg = document.getElementById('lightboxImage');
    const caption = document.getElementById('lightboxCaption');

    function showAtIndex(i) {
      // wrap around both directions
      currentIndex = (i + currentSet.length) % currentSet.length;
      const img = currentSet[currentIndex];
      lightImg.src = img.src;
      lightImg.alt = img.alt;
      caption.textContent = img.alt || '';
    }

    gridEl.addEventListener('click', function (e) {
      const link = e.target.closest('a');
      if (!link) return;
      e.preventDefault();
      showAtIndex(parseInt(link.dataset.index, 10));
      $('#lightboxModal').modal('show');
    });

    document.querySelector('.lightbox-prev').addEventListener('click', () => showAtIndex(currentIndex - 1));
    document.querySelector('.lightbox-next').addEventListener('click', () => showAtIndex(currentIndex + 1));

    // Keyboard arrow support while lightbox is open
    document.addEventListener('keydown', function (e) {
      const isOpen = document.getElementById('lightboxModal').classList.contains('show');
      if (!isOpen) return;
      if (e.key === 'ArrowLeft') showAtIndex(currentIndex - 1);
      if (e.key === 'ArrowRight') showAtIndex(currentIndex + 1);
    });

    // Clear src on hide to free memory on mobile
    $('#lightboxModal').on('hidden.bs.modal', function () {
      lightImg.src = '';
    });
  </script>
</body>
</html>
